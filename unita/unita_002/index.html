<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <title>Unità 002 - Un bravo ragazzo</title>
</head>
<body>

    <div class="main-container">
        <div class="top-nav">
            <a href="../../index.html" class="back-link">← Torna alla Home</a>
            <button onclick="window.parloLogout()" class="logout-button">Logout</button>
        </div>

        <div id="intestazione-container"></div>
        <div id="contenitore-schede"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getDatabase,
            ref,
            push,
            remove,
            onValue
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        import {
            initLogin,
            getUtenteCorrente,
            haAccesso,
            logout,
            mostraLogin
        } from '../../moduli/login.js';

        import {
            initIntestazione,
            generaSceltaPersonale,
            initSceltaPersonale,
            avviaSceltaPersonaleListener,
            generaFlashcard,
            generaForum,
            initForum,
            avviaForumListener,
            generaLavagna,
            initLavagna,
            avviaLavagnaListener,
            ModuloTrasformatore
        } from '../../moduli/index.js';

        import { datiLezione } from './dati-lezione.js';

        const firebaseConfig = {
            databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig, 'unita002');
        const database = getDatabase(app);

        initLogin(app);
        initSceltaPersonale(app);
        initForum(app);
        initLavagna(app);

        const BASE_PATH = 'unita_002';
        const STORAGE_KEY = 'parlo_italiano_unita_002_scheda_aperta';
        const VIDEO_ID_SCHEDA_2 = '6kl8KZftC_A';

        const schede = [
            '🧊 Per rompere il ghiaccio',
            '🎧 Orecchie aperte! (Ascolto)',
            '📖 Leggiamo insieme',
            '🧠 Capiamo il testo',
            '🎤 Creiamo le domande',
            '💬 Parliamone insieme',
            '🧩 Riordina i dialoghi',
            '🎯 Essere o avere?',
            '🔍 Alla scoperta della grammatica',
            '🕵️ Chi è? (Indovinelli)',
            '🔢 I numeri italiani',
            '🏠 Cosa hanno...?',
            '💎 Le mie 3 cose importanti',
            '🗣️ Parla con un compagno',
            '🎤 Parliamo di noi',
            '✅ Autovalutazione'
        ];

        const STATO = {
            utente: null,
            isDocente: false,
            sceltaPersonaleInizializzata: false,
            trasformatoreInizializzato: false,
            lavagnaScheda2Inizializzata: false
        };

        function preparaDatiSceltaPersonale() {
            const scheda = datiLezione.scheda_1;
            const scelta = scheda?.sceltaPersonale;

            if (!scelta) return null;

            return {
                elicitazione: {
                    sceltaPersonale: {
                        domanda: scelta.titolo || scheda.istruzioni || '',
                        fraseBase: scelta.fraseBase || 'Io sono...',
                        fraseClasse: scelta.fraseClasse || '{nome}: {etichetta}',
                        idFirebase: scelta.idFirebase || 'u002_scelta_personale',
                        opzioni: (scelta.opzioni || []).map(opzione => ({
                            id: opzione.id || opzione.valore,
                            etichetta: opzione.etichetta || opzione.testo,
                            img: opzione.img || ''
                        }))
                    }
                }
            };
        }

        function generaParteAttivita2(parte, idFlashcard) {
            if (!parte) return '';

            return `
                <div class="section-separator">
                    <p class="scheda-domanda">${parte.domanda || ''}</p>
                    <p class="scheda-istruzioni">${parte.istruzioni || ''}</p>
                    ${parte.vocabolario?.length
                        ? generaFlashcard(parte.vocabolario, idFlashcard)
                        : ''}
                    ${parte.forum
                        ? generaForum({ forum: parte.forum }, STATO.isDocente)
                        : ''}
                </div>
            `;
        }

        function generaScheda2() {
            return `
                <div class="scheda-video-box">
                    <div class="attivita-label">Attività 1 - Guardate e ascoltate il video</div>
                    <p class="scheda-istruzioni">Guardate il video e ascoltate con attenzione.</p>

                    <div class="video-wrapper">
                        <iframe
                            src="https://www.youtube.com/embed/${VIDEO_ID_SCHEDA_2}?rel=0"
                            title="Video di ascolto dell'Unità 002"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen>
                        </iframe>
                    </div>

                    <div class="section-separator">
                        ${generaLavagna({
                            id: 'u002_ascolto_scanning',
                            placeholder: 'Scrivete le parole che riconoscete...',
                            titolo: 'Attività 2 - Caccia alle parole'
                        })}
                    </div>

                    <div class="section-separator">
                        ${generaForum({
                            forum: {
                                idFirebase: 'u002_ascolto_comprensione',
                                domanda: 'Attività 3 - Mettiti alla prova: scrivi cosa ricordi',
                                placeholder: 'Scrivi qui ciò che hai capito...'
                            }
                        })}
                    </div>
                </div>
            `;
        }

        function configuraTrasformatore(config) {
            return {
                ...config,
                isDocente: STATO.isDocente,

                onSalva: async risposta => {
                    const percorso = ref(
                        database,
                        `${BASE_PATH}/trasformatori/${config.idFirebase}`
                    );

                    await push(percorso, {
                        ...risposta,
                        username: STATO.utente.username,
                        gruppo: STATO.utente.gruppo || '',
                        timestamp: Date.now()
                    });
                },

                onElimina: async risposta => {
                    if (!STATO.isDocente || !risposta?._key) return;

                    if (!confirm(`Vuoi eliminare la risposta di ${risposta.username || 'questo studente'}?`)) {
                        return;
                    }

                    const rispostaRef = ref(
                        database,
                        `${BASE_PATH}/trasformatori/${config.idFirebase}/${risposta._key}`
                    );

                    await remove(rispostaRef);
                }
            };
        }

        function avviaListenerTrasformatore(config) {
            const percorso = ref(
                database,
                `${BASE_PATH}/trasformatori/${config.idFirebase}`
            );

            onValue(percorso, snapshot => {
                const dati = snapshot.val() || {};

                const risposte = Object.entries(dati)
                    .map(([key, risposta]) => ({
                        ...risposta,
                        _key: key
                    }))
                    .filter(risposta => risposta && risposta.username)
                    .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                ModuloTrasformatore.mostraRisposte(config, risposte);
            });
        }

        function generaContenutoScheda1() {
            const scheda = datiLezione.scheda_1;
            if (!scheda) return '';

            const datiSceltaPersonale = preparaDatiSceltaPersonale();
            const attivita2 = scheda.attivita_2;
            const attivita3 = scheda.attivita_3;

            let contenuto = `
                <div class="section-separator section-separator-no-top">
                    ${scheda.immaginePrincipale ? `
                        <div class="scheda-immagine-box">
                            <img
                                src="${scheda.immaginePrincipale}"
                                alt="${scheda.titolo || 'Attività introduttiva'}"
                                class="scheda-immagine scheda-immagine-centrata">
                        </div>
                    ` : ''}

                    <div class="attivita-label">${scheda.titolo || ''}</div>
            `;

            if (datiSceltaPersonale) {
                contenuto += `
                    <div id="contenitore-scelta-personale">
                        <div class="scheda-istruzioni">${scheda.istruzioni || ''}</div>
                        ${generaSceltaPersonale(datiSceltaPersonale, STATO.isDocente)}
                    </div>
                `;
            }

            if (attivita2) {
                contenuto += `
                    <div class="section-separator">
                        <div class="attivita-label">${attivita2.titolo || '📌 Attività 2'}</div>
                        ${generaParteAttivita2(attivita2.cibi, 'u002_cibi')}
                        ${generaParteAttivita2(attivita2.bevande, 'u002_bevande')}
                    </div>
                `;
            }

            if (attivita3) {
                contenuto += `
                    <div class="section-separator">
                        <div id="contenitore-trasformatore"></div>
                    </div>
                `;
            }

            contenuto += '</div>';
            return contenuto;
        }

        function generaSchede() {
            const contenitore = document.getElementById('contenitore-schede');

            contenitore.innerHTML = schede.map((titolo, indice) => {
                const numero = indice + 1;

                let contenuto;

                if (numero === 1) {
                    contenuto = generaContenutoScheda1();
                } else if (numero === 2) {
                    contenuto = generaScheda2();
                } else {
                    contenuto = `
                        <div class="section-separator">
                            <div class="attivita-label">Contenuti in preparazione</div>
                            <p class="scheda-istruzioni">
                                Questa attività sarà disponibile prossimamente.
                            </p>
                        </div>
                    `;
                }

                return `
                    <div class="accordion-item">
                        <div class="accordion-header" onclick="toggleAccordion('scheda_${numero}')">
                            Scheda ${numero}: ${titolo}
                            <span id="arrow_scheda_${numero}">▼</span>
                        </div>

                        <div id="content_scheda_${numero}" class="accordion-content">
                            <div id="contenitore-scheda-${numero}">
                                ${contenuto}
                            </div>

                            <div class="scheda-azioni">
                                <button
                                    onclick="closeAccordion('scheda_${numero}')"
                                    class="logout-button">
                                    Chiudi scheda
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function inizializzaTrasformatore() {
            if (STATO.trasformatoreInizializzato) return;

            const configTrasformatore = datiLezione.scheda_1?.attivita_3;
            const contenitore = document.getElementById('contenitore-trasformatore');

            if (!configTrasformatore || !contenitore) return;

            const config = configuraTrasformatore(configTrasformatore);

            ModuloTrasformatore.init(contenitore, config);
            avviaListenerTrasformatore(config);

            STATO.trasformatoreInizializzato = true;
        }

        function inizializzaLavagnaScheda2() {
            if (STATO.lavagnaScheda2Inizializzata) return;

            const utente = STATO.utente;
            if (!utente) return;

            const idLavagna = 'u002_ascolto_scanning';
            const contenitore = document.getElementById(`lavagna_${idLavagna}`);

            if (!contenitore) return;

            STATO.lavagnaScheda2Inizializzata = true;

            setTimeout(() => {
                avviaLavagnaListener(
                    BASE_PATH,
                    idLavagna,
                    STATO.isDocente,
                    utente.username,
                    `${utente.username}_${Date.now()}`
                );
            }, 100);
        }

        function inizializzaScheda(id) {
            if (id === 'scheda_1') inizializzaTrasformatore();
            if (id === 'scheda_2') inizializzaLavagnaScheda2();
        }

        function avviaPagina(utente) {
            console.log('[U002] avviaPagina:', utente);

            try {
                if (!utente) {
                    console.log('[U002] Utente assente: apro il login');
                    mostraLogin(utenteLoggato => avviaPagina(utenteLoggato));
                    return;
                }

                if (!haAccesso(utente, 2)) {
                    console.warn('[U002] Accesso negato:', utente);
                    alert('Non hai accesso a questa unità!');
                    window.location.href = '../../index.html';
                    return;
                }

                STATO.utente = utente;
                STATO.isDocente = utente.ruolo === 'docenti';

                console.log('[U002] Generazione intestazione');
                initIntestazione({
                    titolo: datiLezione.titolo,
                    sottotitolo: datiLezione.sottotitolo,
                    bannerImg: datiLezione.bannerImg,
                    badge: {
                        nome: utente.username,
                        gruppo: utente.gruppo,
                        icona: '👤'
                    }
                });

                console.log('[U002] Generazione schede');
                generaSchede();

                const datiSceltaPersonale = preparaDatiSceltaPersonale();

                if (datiSceltaPersonale) {
                    avviaSceltaPersonaleListener(
                        BASE_PATH,
                        utente.username,
                        STATO.isDocente
                    );
                    STATO.sceltaPersonaleInizializzata = true;
                }

                const attivita2 = datiLezione.scheda_1?.attivita_2;
                const forumCibi = attivita2?.cibi?.forum;
                const forumBevande = attivita2?.bevande?.forum;

                if (forumCibi?.idFirebase) {
                    avviaForumListener(BASE_PATH, forumCibi.idFirebase, STATO.isDocente);
                }

                if (forumBevande?.idFirebase) {
                    avviaForumListener(BASE_PATH, forumBevande.idFirebase, STATO.isDocente);
                }

                avviaForumListener(BASE_PATH, 'u002_ascolto_comprensione', STATO.isDocente);
                apriSchedaSalvata();

                console.log('[U002] Inizializzazione completata');
            } catch (errore) {
                console.error('[U002] Errore durante l’inizializzazione:', errore);
                document.getElementById('contenitore-schede').innerHTML = `
                    <div class="section-separator" style="color:#b00020;">
                        <strong>Errore durante il caricamento dell’Unità 002.</strong>
                        <p>Controlla la console per il dettaglio.</p>
                    </div>
                `;
            }
        }

        window.toggleAccordion = function(id) {
            const contenuto = document.getElementById(`content_${id}`);
            if (!contenuto) return;

            const eraAperto = contenuto.classList.contains('open');

            document.querySelectorAll('.accordion-content')
                .forEach(elemento => elemento.classList.remove('open'));

            document.querySelectorAll('.accordion-header span')
                .forEach(freccia => freccia.textContent = '▼');

            if (!eraAperto) {
                contenuto.classList.add('open');

                const freccia = document.getElementById(`arrow_${id}`);
                if (freccia) freccia.textContent = '▲';

                localStorage.setItem(STORAGE_KEY, id);
                inizializzaScheda(id);
            } else {
                localStorage.removeItem(STORAGE_KEY);
            }
        };

        window.closeAccordion = function(id) {
            const contenuto = document.getElementById(`content_${id}`);
            const freccia = document.getElementById(`arrow_${id}`);

            if (contenuto) contenuto.classList.remove('open');
            if (freccia) freccia.textContent = '▼';

            localStorage.removeItem(STORAGE_KEY);
        };

        function apriSchedaSalvata() {
            const schedaSalvata = localStorage.getItem(STORAGE_KEY);
            if (!schedaSalvata) return;

            setTimeout(() => {
                const contenuto = document.getElementById(`content_${schedaSalvata}`);

                if (contenuto && !contenuto.classList.contains('open')) {
                    window.toggleAccordion(schedaSalvata);
                }
            }, 200);
        }

        window.parloLogout = logout;

        avviaPagina(getUtenteCorrente());
    </script>
</body>
</html>
