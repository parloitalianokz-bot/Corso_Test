<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <title>Unità 002 - Un bravo ragazzo</title>
</head>
<body>

    <div class="main-container">
        <div class="top-nav">
            <a href="../../index.html" class="back-link">← Torna alla Home</a>
            <button onclick="window.parloLogout()" class="logout-button">Logout</button>
        </div>

        <div id="intestazione-container"></div>
        <div id="contenitore-schede"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            initLogin,
            getUtenteCorrente,
            haAccesso,
            logout,
            mostraLogin
        } from '../../moduli/login.js';

        import {
            initIntestazione,
            generaSceltaPersonale,
            initSceltaPersonale,
            avviaSceltaPersonaleListener
        } from '../../moduli/index.js';

        import { datiLezione } from './dati-lezione.js';

        const firebaseConfig = {
            databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig, 'unita002');

        initLogin(app);
        initSceltaPersonale(app);

        const BASE_PATH = 'unita_002';
        const STORAGE_KEY = 'parlo_italiano_unita_002_scheda_aperta';

        const schede = [
            '🧊 Per rompere il ghiaccio',
            '🎧 Orecchie aperte! (Ascolto)',
            '📖 Leggiamo insieme',
            '🧠 Capiamo il testo',
            '🎤 Creiamo le domande',
            '💬 Parliamone insieme',
            '🧩 Riordina i dialoghi',
            '🎯 Essere o avere?',
            '🔍 Alla scoperta della grammatica',
            '🕵️ Chi è? (Indovinelli)',
            '🔢 I numeri italiani',
            '🏠 Cosa hanno...?',
            '💎 Le mie 3 cose importanti',
            '🗣️ Parla con un compagno',
            '🎤 Parliamo di noi',
            '✅ Autovalutazione'
        ];

        const STATO = {
            utente: null,
            isDocente: false,
            sceltaPersonaleInizializzata: false
        };

        function preparaDatiSceltaPersonale() {
            const scheda = datiLezione.scheda_1;
            const scelta = scheda?.sceltaPersonale;

            if (!scelta) return null;

            return {
                elicitazione: {
                    sceltaPersonale: {
                        domanda: scheda.istruzioni || scelta.titolo || '',
                        fraseBase: scelta.fraseBase || 'Io sono...',
                        fraseClasse: scelta.fraseClasse || '{nome} è {etichetta}',
                        idFirebase: scelta.idFirebase || 'u002_scelta_personale',
                        opzioni: (scelta.opzioni || []).map(opzione => ({
                            id: opzione.id || opzione.valore,
                            etichetta: opzione.etichetta || opzione.testo,
                            img: opzione.img || ''
                        }))
                    }
                }
            };
        }

        function generaContenutoScheda1() {
            const scheda = datiLezione.scheda_1;
            const datiSceltaPersonale = preparaDatiSceltaPersonale();

            if (!scheda || !datiSceltaPersonale) {
                return `
                    <div class="section-separator">
                        <div class="attivita-label">Contenuti in preparazione</div>
                    </div>
                `;
            }

            return `
                <div class="section-separator section-separator-no-top">
                    ${scheda.immaginePrincipale ? `
                        <div class="scheda-immagine-box">
                            <img
                                src="${scheda.immaginePrincipale}"
                                alt="${scheda.titolo || 'Attività introduttiva'}"
                                class="scheda-immagine scheda-immagine-centrata">
                        </div>
                    ` : ''}

                    <div class="attivita-label">${scheda.titolo || ''}</div>

                    <div id="contenitore-scelta-personale">
                        ${generaSceltaPersonale(
                            datiSceltaPersonale,
                            STATO.isDocente
                        )}
                    </div>
                </div>
            `;
        }

        function generaSchede() {
            document.getElementById('contenitore-schede').innerHTML =
                schede.map((titolo, indice) => {
                    const numero = indice + 1;

                    const contenuto = numero === 1
                        ? generaContenutoScheda1()
                        : `
                            <div class="section-separator">
                                <div class="attivita-label">Contenuti in preparazione</div>
                                <p class="scheda-istruzioni">
                                    Questa attività sarà disponibile prossimamente.
                                </p>
                            </div>
                        `;

                    return `
                        <div class="accordion-item">
                            <div
                                class="accordion-header"
                                onclick="toggleAccordion('scheda_${numero}')">
                                Scheda ${numero}: ${titolo}
                                <span id="arrow_scheda_${numero}">▼</span>
                            </div>

                            <div
                                id="content_scheda_${numero}"
                                class="accordion-content">

                                <div id="contenitore-scheda-${numero}">
                                    ${contenuto}
                                </div>

                                <div class="scheda-azioni">
                                    <button
                                        onclick="closeAccordion('scheda_${numero}')"
                                        class="logout-button">
                                        Chiudi scheda
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                })
                .join('');
        }

        function avviaPagina(utente) {
            if (!utente) {
                mostraLogin(utenteLoggato => avviaPagina(utenteLoggato));
                return;
            }

            if (!haAccesso(utente, 2)) {
                alert('Non hai accesso a questa unità!');
                window.location.href = '../../index.html';
                return;
            }

            STATO.utente = utente;
            STATO.isDocente = utente.ruolo === 'docenti';

            initIntestazione({
                titolo: datiLezione.titolo,
                sottotitolo: datiLezione.sottotitolo,
                bannerImg: datiLezione.bannerImg,
                badge: {
                    nome: utente.username,
                    gruppo: utente.gruppo,
                    icona: '👤'
                }
            });

            generaSchede();

            const datiSceltaPersonale = preparaDatiSceltaPersonale();

            if (datiSceltaPersonale) {
                avviaSceltaPersonaleListener(
                    BASE_PATH,
                    utente.username,
                    STATO.isDocente
                );
                STATO.sceltaPersonaleInizializzata = true;
            }

            apriSchedaSalvata();
        }

        window.toggleAccordion = function(id) {
            const contenuto = document.getElementById(`content_${id}`);
            if (!contenuto) return;

            const eraAperto = contenuto.classList.contains('open');

            document.querySelectorAll('.accordion-content')
                .forEach(elemento => elemento.classList.remove('open'));

            document.querySelectorAll('.accordion-header span')
                .forEach(freccia => freccia.textContent = '▼');

            if (!eraAperto) {
                contenuto.classList.add('open');

                const freccia = document.getElementById(`arrow_${id}`);
                if (freccia) freccia.textContent = '▲';

                localStorage.setItem(STORAGE_KEY, id);
            } else {
                localStorage.removeItem(STORAGE_KEY);
            }
        };

        window.closeAccordion = function(id) {
            const contenuto = document.getElementById(`content_${id}`);
            const freccia = document.getElementById(`arrow_${id}`);

            if (contenuto) contenuto.classList.remove('open');
            if (freccia) freccia.textContent = '▼';

            localStorage.removeItem(STORAGE_KEY);
        };

        function apriSchedaSalvata() {
            const schedaSalvata = localStorage.getItem(STORAGE_KEY);
            if (!schedaSalvata) return;

            setTimeout(() => {
                const contenuto = document.getElementById(`content_${schedaSalvata}`);
                const freccia = document.getElementById(`arrow_${schedaSalvata}`);

                if (contenuto) contenuto.classList.add('open');
                if (freccia) freccia.textContent = '▲';
            }, 200);
        }

        window.parloLogout = logout;

        avviaPagina(getUtenteCorrente());
    </script>
</body>
</html>
