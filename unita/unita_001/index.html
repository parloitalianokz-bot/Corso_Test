<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <title>Unità 001 - Motivazione</title>
</head>
<body>

    <div class="main-container">
        <div class="top-nav">
            <a href="../../index.html" class="back-link">← Torna alla Home</a>
            <button onclick="window.parloLogout()" class="logout-button">Logout</button>
        </div>

        <div id="intestazione-container"></div>

        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('scheda_1')">
                Scheda 1: 🧊 Per rompere il ghiaccio <span>▼</span>
            </div>
            <div id="content_scheda_1" class="accordion-content">
                <div id="contenitore-dinamico"></div>
            </div>
        </div>

        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('scheda_2')">
                Scheda 2: 🎧 Orecchie aperte! <span>▼</span>
            </div>
            <div id="content_scheda_2" class="accordion-content">
                <p>Contenuto della Scheda 2 (da implementare)</p>
            </div>
        </div>

        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('scheda_3')">
                Scheda 3: 📖 Leggiamo insieme <span>▼</span>
            </div>
            <div id="content_scheda_3" class="accordion-content">
                <p>Contenuto della Scheda 3 (da implementare)</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            generaSceltaPersonale, 
            initIntestazione, 
            initSceltaPersonale, 
            avviaSceltaPersonaleListener
        } from '../../moduli/index.js';
        import { initLogin, getUtenteCorrente, haAccesso, logout } from '../../moduli/login.js';
        import { datiLezione } from './dati-lezione.js';

        const firebaseConfig = {
            databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig, 'unita001');
        initLogin(app);

        const utente = getUtenteCorrente();

        if (!utente) {
            window.location.href = '../../index.html';
            throw new Error('Accesso negato - utente non autenticato');
        }

        if (!haAccesso(utente, 1)) {
            alert('Non hai accesso a questa unità!');
            window.location.href = '../../index.html';
            throw new Error('Accesso negato - livello insufficiente');
        }

        initSceltaPersonale(app);

        const datiConUtente = {
            ...datiLezione,
            badge: {
                nome: utente.username,
                gruppo: utente.gruppo,
                icona: '👤'
            }
        };

        initIntestazione(datiConUtente);

        const html = generaSceltaPersonale(datiLezione, false);
        document.getElementById('contenitore-dinamico').innerHTML = html;

        const BASE_PATH = `unita_001`;
        avviaSceltaPersonaleListener(BASE_PATH, utente.username, false);

        window.toggleAccordion = function(id) {
            const content = document.getElementById('content_' + id);
            const header = content?.previousElementSibling;
            const arrow = header?.querySelector('span');

            if (!content) return;

            const isOpen = content.classList.contains('open');
            content.classList.toggle('open', !isOpen);
            if (arrow) arrow.innerText = isOpen ? '▼' : '▲';
        };

        window.parloLogout = logout;
    </script>
</body>
</html>
