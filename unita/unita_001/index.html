<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <title>Unità 001 - Motivazione</title>
</head>
<body>

    <div class="main-container">
        <div class="top-nav">
            <a href="../../index.html" class="back-link">← Torna alla Home</a>
            <button onclick="window.parloLogout()" class="logout-button">Logout</button>
        </div>

        <div id="intestazione-container"></div>

        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('scheda_1')">
                Scheda 1: 🧊 Per rompere il ghiaccio <span id="arrow_scheda_1">▼</span>
            </div>
            <div id="content_scheda_1" class="accordion-content">
                <div class="scheda-immagine-box">
                    <img src="img/mappa_italia.webp" alt="Mappa dell'Italia" class="scheda-immagine scheda-immagine-centrata">
                </div>

                <div id="contenitore-dinamico" class="scheda-contenuto-dinamico"></div>

                <div class="scheda-azioni">
                    <button onclick="closeAccordion('scheda_1')" class="logout-button">Chiudi scheda</button>
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('scheda_2')">
                Scheda 2: 🎧 Orecchie aperte! <span id="arrow_scheda_2">▼</span>
            </div>
            <div id="content_scheda_2" class="accordion-content">
                <p>Contenuto della Scheda 2 (da implementare)</p>
                <div class="scheda-azioni">
                    <button onclick="closeAccordion('scheda_2')" class="logout-button">Chiudi scheda</button>
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('scheda_3')">
                Scheda 3: 📖 Leggiamo insieme <span id="arrow_scheda_3">▼</span>
            </div>
            <div id="content_scheda_3" class="accordion-content">
                <p>Contenuto della Scheda 3 (da implementare)</p>
                <div class="scheda-azioni">
                    <button onclick="closeAccordion('scheda_3')" class="logout-button">Chiudi scheda</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            generaSceltaPersonale,
            generaFlashcard,
            generaForum,
            initIntestazione,
            initSceltaPersonale,
            initForum,
            avviaSceltaPersonaleListener,
            avviaForumListener
        } from '../../moduli/index.js';
        import { initLogin, getUtenteCorrente, haAccesso, logout, mostraLogin } from '../../moduli/login.js';
        import { datiLezione } from './dati-lezione.js';

        const firebaseConfig = {
            databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig, 'unita001');
        initLogin(app);
        initSceltaPersonale(app);
        initForum(app);

        function avviaPagina(utente) {
            if (!utente) {
                mostraLogin((utenteLoggato) => avviaPagina(utenteLoggato));
                return;
            }

            if (!haAccesso(utente, 1)) {
                alert('Non hai accesso a questa unità!');
                window.location.href = '../../index.html';
                return;
            }

            const datiConUtente = {
                ...datiLezione,
                badge: {
                    nome: utente.username,
                    gruppo: utente.gruppo,
                    icona: '👤'
                }
            };

            initIntestazione(datiConUtente);

            const isDocente = utente.ruolo === 'docenti';

            const htmlScelta = datiLezione.elicitazione?.sceltaPersonale
                ? `
                    <div class="section-separator section-separator-no-top">
                        <div class="attivita-label">Attività 1</div>
                        ${generaSceltaPersonale(datiLezione, isDocente)}
                    </div>
                `
                : '';

            const htmlFlashcard = datiLezione.vocabolario && datiLezione.vocabolario.length
                ? `
                    <div class="section-separator">
                        <div class="attivita-label">Attività 2</div>
                        ${generaFlashcard(datiLezione.vocabolario, 'u001')}
                    </div>
                `
                : '';

            const htmlForum = datiLezione.forum
                ? `
                    <div class="section-separator">
                        <div class="attivita-label">Attività 3</div>
                        ${generaForum(datiLezione)}
                    </div>
                `
                : '';

            document.getElementById('contenitore-dinamico').innerHTML = htmlScelta + htmlFlashcard + htmlForum;

            const BASE_PATH = `unita_001`;
            avviaSceltaPersonaleListener(BASE_PATH, utente.username, isDocente);
            avviaForumListener(BASE_PATH, datiLezione.forum?.idFirebase || 'unita001_forum_parole', isDocente);

            const STORAGE_KEY = 'parlo_italiano_unita_001_scheda_aperta';

            window.toggleAccordion = function(id) {
                const currentContent = document.getElementById('content_' + id);
                if (!currentContent) return;

                const isOpen = currentContent.classList.contains('open');

                document.querySelectorAll('.accordion-content').forEach(content => {
                    content.classList.remove('open');
                });

                document.querySelectorAll('.accordion-header span').forEach(arrow => {
                    arrow.textContent = '▼';
                });

                if (!isOpen) {
                    currentContent.classList.add('open');
                    const arrow = document.getElementById('arrow_' + id);
                    if (arrow) arrow.textContent = '▲';
                    localStorage.setItem(STORAGE_KEY, id);
                } else {
                    localStorage.removeItem(STORAGE_KEY);
                }
            };

            window.closeAccordion = function(id) {
                const content = document.getElementById('content_' + id);
                const arrow = document.getElementById('arrow_' + id);
                if (content) content.classList.remove('open');
                if (arrow) arrow.textContent = '▼';
                localStorage.removeItem(STORAGE_KEY);
            };

            const schedaSalvata = localStorage.getItem(STORAGE_KEY);
            if (schedaSalvata) {
                setTimeout(() => {
                    const content = document.getElementById('content_' + schedaSalvata);
                    const arrow = document.getElementById('arrow_' + schedaSalvata);
                    if (content) content.classList.add('open');
                    if (arrow) arrow.textContent = '▲';
                }, 0);
            }

            window.parloLogout = logout;
        }

        avviaPagina(getUtenteCorrente());
    </script>
</body>
</html>
