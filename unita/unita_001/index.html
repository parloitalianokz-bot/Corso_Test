<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <title>Unità 001 - Motivazione</title>
</head>
<body>

    <div class="main-container">
        <!-- Intestazione -->
        <div id="intestazione-container"></div>
        <div id="contenitore-dinamico"></div>
    </div>

    <script type="module">
        // ================================================================
        // 1. IMPORTA FIREBASE E MODULI
        // ================================================================
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        
        import { generaSceltaPersonale, initIntestazione, initSceltaPersonale, avviaSceltaPersonaleListener } from '../../moduli/index.js';

        // ================================================================
        // 2. CONFIGURAZIONE FIREBASE
        // ================================================================

        const firebaseConfig = {
            databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig, 'unita001');

        // ================================================================
        // 3. DATI DELLA LEZIONE
        // ================================================================

        import { datiLezione } from './dati-lezione.js';

        // ================================================================
        // 4. INIZIALIZZA IL MODULO CON IL DATABASE
        // ================================================================

        initSceltaPersonale(app);

        // ================================================================
        // 5. GENERA LA PAGINA
        // ================================================================

        console.log('🚀 Avvio Unità 001...');

        // Intestazione
        initIntestazione(datiLezione);

        // Contenuto
        const html = generaSceltaPersonale(datiLezione, false);
        document.getElementById('contenitore-dinamico').innerHTML = html;

        // ================================================================
        // 6. AVVIA IL LISTENER PER LE RISPOSTE
        // ================================================================

        const BASE_PATH = `unita_001`;
        const myUserName = localStorage.getItem('parlo_italiano_username') || 'Studente';

        avviaSceltaPersonaleListener(BASE_PATH, myUserName, false);

        console.log('✅ Unità 001 caricata!');
        console.log('ℹ️ Clicca su un\'opzione per testare');
    </script>
</body>
</html>
