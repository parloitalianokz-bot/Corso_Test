<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <title>Unità 001 - Motivazione</title>
</head>
<body>

    <div class="main-container">
        <div class="top-nav">
            <a href="../../index.html" class="back-link">← Torna alla Home</a>
            <button onclick="window.parloLogout()" class="logout-button">Logout</button>
        </div>

        <div id="intestazione-container"></div>

        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('scheda_1')">
                Scheda 1: 🧊 Per rompere il ghiaccio <span id="arrow_scheda_1">▼</span>
            </div>
            <div id="content_scheda_1" class="accordion-content">
                <div class="scheda-immagine-box">
                    <img src="img/mappa_italia.webp" alt="Mappa dell'Italia" class="scheda-immagine scheda-immagine-centrata">
                    <p class="scheda-didascalia">
                        🇮🇹 L'Italia è un paese ricco di cultura, storia e... buon cibo! Ma perché studi l'italiano?
                    </p>
                </div>

                <div id="contenitore-dinamico" class="scheda-contenuto-dinamico"></div>

                <div class="scheda-azioni">
                    <button onclick="closeAccordion('scheda_1')" class="logout-button">Chiudi scheda</button>
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('scheda_2')">
                Scheda 2: 🎧 Orecchie aperte! <span id="arrow_scheda_2">▼</span>
            </div>
            <div id="content_scheda_2" class="accordion-content">
                <div id="contenitore-ascolto"></div>

                <div class="scheda-azioni">
                    <button onclick="closeAccordion('scheda_2')" class="logout-button">Chiudi scheda</button>
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <div class="accordion-header" onclick="toggleAccordion('scheda_3')">
                Scheda 3: 📖 Leggiamo insieme <span id="arrow_scheda_3">▼</span>
            </div>
            <div id="content_scheda_3" class="accordion-content">
                <div id="contenitore-lettura"></div>

                <div class="scheda-azioni">
                    <button onclick="closeAccordion('scheda_3')" class="logout-button">Chiudi scheda</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            generaSceltaPersonale,
            generaFlashcard,
            generaForum,
            initIntestazione,
            initSceltaPersonale,
            initForum,
            avviaSceltaPersonaleListener,
            avviaForumListener,
            generaLavagna,
            avviaLavagnaListener,
            initLavagna
        } from '../../moduli/index.js';
        import { initLogin, getUtenteCorrente, haAccesso, logout, mostraLogin } from '../../moduli/login.js';
        import { datiLezione } from './dati-lezione.js';
        import { glossarizzaTesto } from '../../moduli/glossario.js';

        const firebaseConfig = {
            databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig, 'unita001');
        initLogin(app);
        initSceltaPersonale(app);
        initForum(app);
        initLavagna(app);

        function renderScheda2() {
            const ascolto = datiLezione.ascolto;
            if (!ascolto) return '';
            const htmlVideo = `
                <div class="scheda-video-box">
                    <div class="attivita-label">Attività 1 - Guardate e ascoltate il video</div>
                    <p class="scheda-istruzioni">${ascolto.istruzioni}</p>
                    <div class="video-wrapper">
                        <iframe
                            src="https://www.youtube.com/embed/${ascolto.videoUrl}?rel=0"
                            title="Video ascolto"
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>
            `;
            const htmlLavagna = ascolto.scanning
                ? `
                    <div class="section-separator">
                        ${generaLavagna({
                            id: ascolto.scanning.id,
                            placeholder: ascolto.scanning.placeholder,
                            titolo: ascolto.scanning.titolo || 'Attività 2 - Caccia alle parole'
                        })}
                    </div>
                `
                : '';
            const htmlForum = ascolto.comprensione
                ? `
                    <div class="section-separator">
                        ${generaForum({
                            forum: {
                                idFirebase: ascolto.comprensione.id,
                                domanda: ascolto.comprensione.domanda || 'Attività 3 - Mettiti alla prova, scrivi cosa ricordi',
                                placeholder: ascolto.comprensione.placeholder
                            }
                        })}
                    </div>
                `
                : '';
            return htmlVideo + htmlLavagna + htmlForum;
        }

        function renderScheda3() {
            const lettura = datiLezione.lettura;
            if (!lettura) return '';
            
            const paragrafi = (lettura.paragrafi || []);
            const glossario = (lettura.glossario || []);

            // Glossarizzazione semplice: testo → glossarizzato
            const paragrafiGlossati = paragrafi
                .map(p => {
                    // Se il paragrafo contiene già HTML (<strong>), glossarizziamo
                    // solo il contenuto testuale tra i tag
                    if (/<[^>]+>/.test(p)) {
                        return '<p class="lettura-paragrafo">' + p.replace(/>([^<]+)</g, (match, group) => {
                            return '>' + glossarizzaTesto(group, glossario) + '<';
                        }) + '</p>';
                    }
                    // Altrimenti glossarizziamo tutto il testo
                    return '<p class="lettura-paragrafo">' + glossarizzaTesto(p, glossario) + '</p>';
                })
                .join('');

            return `
                <div class="scheda-lettura-box">
                    <h3 class="scheda-lettura-titolo">${lettura.titolo || ''}</h3>
                    <div class="scheda-lettura-pagina">
                        ${paragrafiGlossati}
                    </div>
                    <div class="section-separator">
                        ${generaLavagna({
                            id: lettura.brainstorming.id,
                            placeholder: lettura.brainstorming.placeholder,
                            titolo: lettura.brainstorming.titolo
                        })}
                    </div>
                </div>
            `;
        }

        function avviaPagina(utente) {
            if (!utente) {
                mostraLogin((utenteLoggato) => avviaPagina(utenteLoggato));
                return;
            }
            if (!haAccesso(utente, 1)) {
                alert('Non hai accesso a questa unità!');
                window.location.href = '../../index.html';
                return;
            }
            const datiConUtente = {
                ...datiLezione,
                badge: {
                    nome: utente.username,
                    gruppo: utente.gruppo,
                    icona: '👤'
                }
            };
            initIntestazione(datiConUtente);

            const isDocente = utente.ruolo === 'docenti';
            window.isDocente = isDocente;

            const htmlScelta = datiLezione.elicitazione?.sceltaPersonale
                ? `
                    <div class="section-separator section-separator-no-top">
                        <div class="attivita-label">Attività 1</div>
                        ${generaSceltaPersonale(datiLezione, isDocente)}
                    </div>
                `
                : '';

            const htmlFlashcard = datiLezione.vocabolario && datiLezione.vocabolario.length
                ? `
                    <div class="section-separator">
                        <div class="attivita-label">Attività 2</div>
                        ${generaFlashcard(datiLezione.vocabolario, 'u001')}
                    </div>
                `
                : '';

            const htmlForum = datiLezione.forum
                ? `
                    <div class="section-separator">
                        <div class="attivita-label">Attività 3</div>
                        ${generaForum(datiLezione)}
                    </div>
                `
                : '';

            document.getElementById('contenitore-dinamico').innerHTML = htmlScelta + htmlFlashcard + htmlForum;
            document.getElementById('contenitore-ascolto').innerHTML = renderScheda2();
            document.getElementById('contenitore-lettura').innerHTML = renderScheda3();

            const BASE_PATH = 'unita_001';

            avviaSceltaPersonaleListener(BASE_PATH, utente.username, isDocente);

            if (datiLezione.forum?.idFirebase) {
                avviaForumListener(BASE_PATH, datiLezione.forum.idFirebase, isDocente);
            }
            if (datiLezione.ascolto?.comprensione?.id) {
                avviaForumListener(BASE_PATH, datiLezione.ascolto.comprensione.id, isDocente);
            }

            let lavagnaInizializzata = false;
            let lavagnaLetturaInizializzata = false;

            function initLavagnaSeNecessario() {
                if (lavagnaInizializzata) return;
                if (datiLezione.ascolto?.scanning?.id) {
                    setTimeout(() => {
                        avviaLavagnaListener(
                            BASE_PATH,
                            datiLezione.ascolto.scanning.id,
                            isDocente,
                            utente.username,
                            `${utente.username}_${Date.now()}`
                        );
                        lavagnaInizializzata = true;
                    }, 100);
                }
            }

            function initLavagnaLetturaSeNecessario() {
                if (lavagnaLetturaInizializzata) return;
                if (datiLezione.lettura?.brainstorming?.id) {
                    setTimeout(() => {
                        avviaLavagnaListener(
                            BASE_PATH,
                            datiLezione.lettura.brainstorming.id,
                            isDocente,
                            utente.username,
                            `${utente.username}_${Date.now()}`
                        );
                        lavagnaLetturaInizializzata = true;
                    }, 100);
                }
            }

            const STORAGE_KEY = 'parlo_italiano_unita_001_scheda_aperta';

            window.toggleAccordion = function(id) {
                const currentContent = document.getElementById('content_' + id);
                if (!currentContent) return;
                const isOpen = currentContent.classList.contains('open');
                document.querySelectorAll('.accordion-content').forEach(content => {
                    content.classList.remove('open');
                });
                document.querySelectorAll('.accordion-header span').forEach(arrow => {
                    arrow.textContent = '▼';
                });
                if (!isOpen) {
                    currentContent.classList.add('open');
                    const arrow = document.getElementById('arrow_' + id);
                    if (arrow) arrow.textContent = '▲';
                    localStorage.setItem(STORAGE_KEY, id);
                    if (id === 'scheda_2') initLavagnaSeNecessario();
                    if (id === 'scheda_3') initLavagnaLetturaSeNecessario();
                } else {
                    localStorage.removeItem(STORAGE_KEY);
                }
            };

            window.closeAccordion = function(id) {
                const content = document.getElementById('content_' + id);
                const arrow = document.getElementById('arrow_' + id);
                if (content) content.classList.remove('open');
                if (arrow) arrow.textContent = '▼';
                localStorage.removeItem(STORAGE_KEY);
            };

            const schedaSalvata = localStorage.getItem(STORAGE_KEY);
            if (schedaSalvata) {
                setTimeout(() => {
                    const content = document.getElementById('content_' + schedaSalvata);
                    const arrow = document.getElementById('arrow_' + schedaSalvata);
                    if (content) content.classList.add('open');
                    if (arrow) arrow.textContent = '▲';
                    if (schedaSalvata === 'scheda_2') initLavagnaSeNecessario();
                    if (schedaSalvata === 'scheda_3') initLavagnaLetturaSeNecessario();
                }, 200);
            }

            window.parloLogout = logout;
        }

        avviaPagina(getUtenteCorrente());
    </script>
</body>
</html>
